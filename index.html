<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>블루 카오스 드래곤 슈팅 게임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
            display: block;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-2 sm:p-4 select-none">

    <div class="flex flex-col items-center w-full max-w-md">
        <!-- 상단 헤더 -->
        <header class="mb-2 text-center">
            <h1 class="text-xl sm:text-2xl font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-400">
                비행기 조종 테스트
        <!-- 대시보드 (체력 및 오른쪽 위 상단 점수 표시) -->
        <div class="w-full flex justify-between items-center bg-slate-900/80 backdrop-blur border border-slate-800 rounded-t-xl px-4 py-2.5 text-sm font-bold">
            <div class="text-emerald-400 flex items-center gap-1.5">
                <span>HP:</span>
                <div class="flex gap-1" id="hpContainer">
                    <span class="inline-block w-3 h-3 bg-red-500 rounded-full"></span>
                    <span class="inline-block w-3 h-3 bg-red-500 rounded-full"></span>
                    <span class="inline-block w-3 h-3 bg-red-500 rounded-full"></span>
                </div>
            </div>
            <!-- 화면 오른쪽 위 현재 점수 표시 -->
            <div class="text-amber-400 flex items-center gap-1.5 bg-slate-800/80 px-3 py-1 rounded-lg border border-amber-500/30">
                <span class="text-xs text-slate-400">SCORE:</span>
                <span id="scoreText" class="text-amber-300 font-extrabold text-base">0</span>
            </div>
        </div>

        <!-- 게임 화면 영역 -->
        <div id="game-container" class="relative w-full overflow-hidden border-2 border-indigo-500/30 rounded-b-xl shadow-2xl shadow-indigo-950/50">
            <!-- 화면 우상단 오버레이 점수 배지 -->
            <div class="absolute top-3 right-3 bg-slate-900/90 border border-amber-400/40 px-3 py-1 rounded-lg text-amber-300 font-black text-sm shadow-lg z-10 pointer-events-none flex items-center gap-1">
                <span class="text-[10px] text-amber-400/80 font-bold tracking-wider">PTS</span>
                <span id="overlayScoreText" class="text-amber-300 text-base">0</span>
            </div>
            <canvas id="gameCanvas" class="w-full h-auto"></canvas>

            <!-- 게임 오버 오버레이 -->
            <div id="gameOverModal" class="hidden absolute inset-0 bg-black/80 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center z-10">
                <h2 class="text-3xl font-black text-red-500 mb-2">GAME OVER</h2>
                <p class="text-slate-300 text-sm mb-1">드래곤 군단에 격추당했습니다!</p>
                <p class="text-amber-400 text-lg font-bold mb-6">최종 점수: <span id="finalScore">0</span>점</p>
                <button id="restartBtn" class="px-6 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold rounded-xl shadow-lg transition transform active:scale-95">
                    다시 도전하기
                </button>
            </div>
        </div>

        <!-- 스마트폰/모바일 하단 터치 컨트롤러 패드 -->
        <div class="w-full grid grid-cols-12 gap-2 mt-3 px-1 select-none">
            <!-- 십자 방향키 영역 -->
            <div class="col-span-7 grid grid-cols-3 gap-1.5 bg-slate-900/90 p-2 rounded-2xl border border-indigo-500/30 shadow-lg touch-none">
                <div></div>
                <button id="btnUp" class="bg-indigo-950/80 active:bg-indigo-600 hover:bg-indigo-900 border border-indigo-500/40 text-cyan-300 py-3 rounded-xl font-black text-lg flex items-center justify-center shadow-md transition-all active:scale-95 touch-none">▲</button>
                <div></div>
                <button id="btnLeft" class="bg-indigo-950/80 active:bg-indigo-600 hover:bg-indigo-900 border border-indigo-500/40 text-cyan-300 py-3 rounded-xl font-black text-lg flex items-center justify-center shadow-md transition-all active:scale-95 touch-none">◀</button>
                <button id="btnDown" class="bg-indigo-950/80 active:bg-indigo-600 hover:bg-indigo-900 border border-indigo-500/40 text-cyan-300 py-3 rounded-xl font-black text-lg flex items-center justify-center shadow-md transition-all active:scale-95 touch-none">▼</button>
                <button id="btnRight" class="bg-indigo-950/80 active:bg-indigo-600 hover:bg-indigo-900 border border-indigo-500/40 text-cyan-300 py-3 rounded-xl font-black text-lg flex items-center justify-center shadow-md transition-all active:scale-95 touch-none">▶</button>
            </div>
            <!-- FIRE 발사 버튼 영역 -->
            <div class="col-span-5 flex items-center justify-center touch-none">
                <button id="btnFire" class="w-full h-full bg-gradient-to-br from-orange-500 to-red-600 active:from-orange-600 active:to-red-700 text-white font-black rounded-2xl shadow-lg border border-orange-400/50 flex flex-col items-center justify-center gap-1 p-3 text-base active:scale-95 transition-all touch-none">
                    <span class="text-2xl">🔥</span>
                    <span class="tracking-wider text-xs">FIRE</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 게임 고정 가상 해상도
        const GAME_WIDTH = 400;
        const GAME_HEIGHT = 600;

        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;

        // 게임 상태 관리
        let score = 0;
        let hp = 3;
        let isGameOver = false;

        // 이동 및 발사 키 상태
        const keys = {
            ArrowUp: false,
            ArrowDown: false,
            ArrowLeft: false,
            ArrowRight: false,
            Space: false
        };

        const bullets = [];
        let lastShootTime = 0;
        const SHOOT_COOLDOWN = 130;

        const enemies = [];
        let lastEnemySpawnTime = 0;
        const ENEMY_SPAWN_INTERVAL = 1600;

        const particles = [];

        // 비행기 상태 (손그림 비율에 맞춰 크기 조정)
        const player = {
            x: GAME_WIDTH / 2,
            y: GAME_HEIGHT - 80,
            width: 64,
            height: 75,
            speed: 5.5
        };

        function drawPlayerSpaceship(x, y, w, h) {
            ctx.save();
            ctx.translate(x, y);

            ctx.lineWidth = 2.5;
            ctx.strokeStyle = '#0f172a';
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            // 1. 하단 엔진 불꽃 분사
            ctx.fillStyle = '#f97316';
            ctx.beginPath();
            ctx.moveTo(-w * 0.37, h * 0.32);
            ctx.lineTo(-w * 0.32, h * 0.32 + 12 + Math.random() * 6);
            ctx.lineTo(-w * 0.27, h * 0.32);
            ctx.moveTo(w * 0.27, h * 0.32);
            ctx.lineTo(w * 0.32, h * 0.32 + 12 + Math.random() * 6);
            ctx.lineTo(w * 0.37, h * 0.32);
            ctx.fill();

            // 2. 좌우 양쪽 보라색 엔진 포드 & 지지대
            ctx.fillStyle = '#a5b4fc';
            ctx.beginPath();
            ctx.moveTo(-w * 0.2, -h * 0.08);
            ctx.lineTo(-w * 0.48, -h * 0.18);
            ctx.lineTo(-w * 0.48, h * 0.28);
            ctx.lineTo(-w * 0.22, h * 0.32);
            ctx.lineTo(-w * 0.2, h * 0.12);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(w * 0.2, -h * 0.08);
            ctx.lineTo(w * 0.48, -h * 0.18);
            ctx.lineTo(w * 0.48, h * 0.28);
            ctx.lineTo(w * 0.22, h * 0.32);
            ctx.lineTo(w * 0.2, h * 0.12);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 엔진 분사구 (검은색)
            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.rect(-w * 0.46, h * 0.26, w * 0.2, h * 0.07);
            ctx.rect(w * 0.26, h * 0.26, w * 0.2, h * 0.07);
            ctx.fill();
            ctx.stroke();

            // 3. 중앙 유선형 동체 (보라색 메인 헐)
            ctx.fillStyle = '#818cf8';
            ctx.beginPath();
            ctx.moveTo(0, -h * 0.52);
            ctx.bezierCurveTo(-w * 0.35, -h * 0.2, -w * 0.36, h * 0.1, -w * 0.24, h * 0.42);
            ctx.lineTo(0, h * 0.34);
            ctx.lineTo(w * 0.24, h * 0.42);
            ctx.bezierCurveTo(w * 0.36, h * 0.1, w * 0.35, -h * 0.2, 0, -h * 0.52);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 4. 동체 내부 지그재그 살구/오렌지색 내각 테두리
            ctx.fillStyle = '#fed7aa';
            ctx.beginPath();
            ctx.moveTo(0, -h * 0.38);
            ctx.lineTo(-w * 0.22, -h * 0.1);
            ctx.lineTo(-w * 0.17, 0);
            ctx.lineTo(-w * 0.22, h * 0.15);
            ctx.lineTo(-w * 0.14, h * 0.28);
            ctx.lineTo(0, h * 0.24);
            ctx.lineTo(w * 0.14, h * 0.28);
            ctx.lineTo(w * 0.22, h * 0.15);
            ctx.lineTo(w * 0.17, 0);
            ctx.lineTo(w * 0.22, -h * 0.1);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 5. 중앙 녹색 캡슐 캐노피 및 세로 줄무늬
            ctx.fillStyle = '#22c55e';
            ctx.beginPath();
            ctx.ellipse(0, -h * 0.02, w * 0.14, h * 0.18, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-w * 0.11, -h * 0.09); ctx.lineTo(w * 0.11, -h * 0.09);
            ctx.moveTo(-w * 0.14, -h * 0.02); ctx.lineTo(w * 0.14, -h * 0.02);
            ctx.moveTo(-w * 0.11, h * 0.05); ctx.lineTo(w * 0.11, h * 0.05);
            ctx.stroke();

            // 6. 전면 노즈콘 및 삼각형 문양
            ctx.fillStyle = '#334155';
            ctx.beginPath();
            ctx.moveTo(0, -h * 0.48);
            ctx.lineTo(-w * 0.06, -h * 0.38);
            ctx.lineTo(w * 0.06, -h * 0.38);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 7. 후방 초록색 액센트 조명
            ctx.fillStyle = '#10b981';
            ctx.beginPath();
            ctx.rect(-w * 0.26, h * 0.16, 5, 7);
            ctx.rect(w * 0.26 - 5, h * 0.16, 5, 7);
            ctx.fill();
            ctx.stroke();

            ctx.restore();
        }

        function drawEnemyDragon(x, y) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(0.75, 0.75);

            ctx.lineWidth = 2.5;
            ctx.strokeStyle = '#0f172a';
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            // 1. 휘어진 S자 하늘색 몸통 & 꼬리
            ctx.fillStyle = '#7dd3fc';
            ctx.beginPath();
            ctx.moveTo(-10, -30);
            ctx.bezierCurveTo(-45, -10, -50, 25, -20, 40);
            ctx.bezierCurveTo(15, 55, 35, 25, 10, 0);
            ctx.bezierCurveTo(-10, -15, 0, -35, 15, -25);
            ctx.bezierCurveTo(35, -10, -5, 65, -30, 45);
            ctx.bezierCurveTo(-60, 20, -30, -25, -10, -30);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 2. 연노란색 배 복부
            ctx.fillStyle = '#fef08a';
            ctx.beginPath();
            ctx.moveTo(-12, -15);
            ctx.bezierCurveTo(-32, 5, -32, 28, -12, 33);
            ctx.bezierCurveTo(0, 20, -5, -5, -12, -15);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 3. 용의 머리와 큰 입
            ctx.fillStyle = '#7dd3fc';
            ctx.beginPath();
            ctx.moveTo(-10, -30);
            ctx.lineTo(-32, -50);
            ctx.lineTo(-12, -35);
            ctx.lineTo(10, -42);
            ctx.lineTo(0, -20);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 빨간색 입 내부
            ctx.fillStyle = '#dc2626';
            ctx.beginPath();
            ctx.moveTo(-12, -32);
            ctx.lineTo(-28, -46);
            ctx.lineTo(-11, -35);
            ctx.lineTo(6, -40);
            ctx.closePath();
            ctx.fill();

            // 날카로운 흰 이빨
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(-24, -44); ctx.lineTo(-22, -40); ctx.lineTo(-20, -43);
            ctx.moveTo(-2, -38); ctx.lineTo(1, -36); ctx.lineTo(3, -39);
            ctx.fill();

            // 4. 분홍색 2개의 뿔 & 줄무늬
            ctx.fillStyle = '#f472b6';
            // 왼쪽 뿔
            ctx.beginPath();
            ctx.moveTo(-20, -45);
            ctx.quadraticCurveTo(-40, -65, -30, -75);
            ctx.quadraticCurveTo(-20, -65, -12, -50);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 오른쪽 뿔
            ctx.beginPath();
            ctx.moveTo(-8, -43);
            ctx.quadraticCurveTo(-15, -70, -3, -78);
            ctx.quadraticCurveTo(8, -65, 3, -42);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 뿔 줄무늬
            ctx.strokeStyle = '#be185d';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(-28, -60); ctx.lineTo(-21, -62);
            ctx.moveTo(-10, -63); ctx.lineTo(-4, -66);
            ctx.stroke();

            // 5. 앞발과 녹색 발톱
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 2;
            
            ctx.fillStyle = '#7dd3fc';
            ctx.beginPath();
            ctx.arc(-22, -10, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(8, -12, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // 녹색 발톱 끝
            ctx.fillStyle = '#15803d';
            ctx.beginPath();
            ctx.arc(-27, -14, 2.5, 0, Math.PI * 2);
            ctx.arc(-28, -8, 2.5, 0, Math.PI * 2);
            ctx.arc(-25, -2, 2.5, 0, Math.PI * 2);
            ctx.arc(13, -16, 2.5, 0, Math.PI * 2);
            ctx.arc(15, -10, 2.5, 0, Math.PI * 2);
            ctx.arc(12, -4, 2.5, 0, Math.PI * 2);
            ctx.fill();

            // 검은 눈동자
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(-5, -43, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        window.addEventListener('keydown', (e) => {
            if (e.code in keys) {
                keys[e.code] = true;
                if (e.code === 'Space') e.preventDefault();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code in keys) {
                keys[e.code] = false;
            }
        });

        // 모바일 터치/마우스 멀티 터치 지원 이벤트 바인딩
        function setupTouchButton(id, keyName) {
            const btn = document.getElementById(id);
            if (!btn) return;
            
            const startHandler = (e) => {
                if (e.cancelable) e.preventDefault();
                keys[keyName] = true;
            };
            const endHandler = (e) => {
                if (e.cancelable) e.preventDefault();
                keys[keyName] = false;
            };

            btn.addEventListener('touchstart', startHandler, { passive: false });
            btn.addEventListener('touchend', endHandler, { passive: false });
            btn.addEventListener('touchcancel', endHandler, { passive: false });
            btn.addEventListener('mousedown', startHandler);
            btn.addEventListener('mouseup', endHandler);
            btn.addEventListener('mouseleave', endHandler);
        }

        setupTouchButton('btnUp', 'ArrowUp');
        setupTouchButton('btnDown', 'ArrowDown');
        setupTouchButton('btnLeft', 'ArrowLeft');
        setupTouchButton('btnRight', 'ArrowRight');
        setupTouchButton('btnFire', 'Space');

        function createBullet() {
            bullets.push({
                x: player.x,
                y: player.y - player.height / 2 - 2,
                speed: 10,
                width: 6,
                height: 18
            });
        }

        function createEnemy() {
            const margin = 45;
            const randomX = Math.random() * (GAME_WIDTH - margin * 2) + margin;
            enemies.push({
                x: randomX,
                y: -60,
                speed: 1.6 + Math.random() * 0.8
            });
        }

        function addExplosion(x, y, color = '#38bdf8') {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    radius: Math.random() * 3 + 2,
                    color: color,
                    alpha: 1,
                    decay: Math.random() * 0.04 + 0.02
                });
            }
        }

        function updatePlayerPosition() {
            if (keys.ArrowUp) player.y -= player.speed;
            if (keys.ArrowDown) player.y += player.speed;
            if (keys.ArrowLeft) player.x -= player.speed;
            if (keys.ArrowRight) player.x += player.speed;

            const halfW = player.width / 2;
            const halfH = player.height / 2;
            player.x = Math.max(halfW, Math.min(GAME_WIDTH - halfW, player.x));
            player.y = Math.max(halfH, Math.min(GAME_HEIGHT - halfH, player.y));
        }

        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bullets[i].speed;
                if (bullets[i].y < -20) {
                    bullets.splice(i, 1);
                }
            }
        }

        function updateEnemies() {
            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].y += enemies[i].speed;

                // 비행기와의 플레이어 직접 충돌 감지
                const dx = player.x - enemies[i].x;
                const dy = player.y - enemies[i].y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 38) {
                    addExplosion(enemies[i].x, enemies[i].y, '#ef4444');
                    enemies.splice(i, 1);
                    takeDamage();
                    continue;
                }

                // 화면 아래로 넘어갈 때
                if (enemies[i].y - 60 > GAME_HEIGHT) {
                    enemies.splice(i, 1);
                }
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function checkCollisions() {
            for (let b = bullets.length - 1; b >= 0; b--) {
                for (let e = enemies.length - 1; e >= 0; e--) {
                    if (!bullets[b] || !enemies[e]) continue;

                    const dx = bullets[b].x - enemies[e].x;
                    const dy = bullets[b].y - enemies[e].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 38) {
                        addExplosion(enemies[e].x, enemies[e].y, '#7dd3fc');
                        bullets.splice(b, 1);
                        enemies.splice(e, 1);
                        
                        // 적 격추 시 10점 추가 및 화면 오른쪽 위 점수 갱신
                        score += 10;
                        updateScoreDisplay();
                        break;
                    }
                }
            }
        }

        function updateScoreDisplay() {
            const scoreTextEl = document.getElementById('scoreText');
            const overlayScoreTextEl = document.getElementById('overlayScoreText');
            if (scoreTextEl) scoreTextEl.textContent = score;
            if (overlayScoreTextEl) overlayScoreTextEl.textContent = score;
        }

        function takeDamage() {
            hp--;
            renderHP();
            if (hp <= 0) {
                gameOver();
            }
        }

        function renderHP() {
            const container = document.getElementById('hpContainer');
            container.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const dot = document.createElement('span');
                dot.className = `inline-block w-3 h-3 rounded-full ${i < hp ? 'bg-red-500 shadow-sm shadow-red-500' : 'bg-slate-700'}`;
                container.appendChild(dot);
            }
        }

        function gameOver() {
            isGameOver = true;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverModal').classList.remove('hidden');
        }

        function restartGame() {
            score = 0;
            hp = 3;
            isGameOver = false;
            bullets.length = 0;
            enemies.length = 0;
            particles.length = 0;
            player.x = GAME_WIDTH / 2;
            player.y = GAME_HEIGHT - 80;

            updateScoreDisplay();
            renderHP();
            document.getElementById('gameOverModal').classList.add('hidden');
        }

        document.getElementById('restartBtn').addEventListener('click', restartGame);

        function drawBackground() {
            ctx.fillStyle = '#060913';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // 격자 스타일 배경 선
            ctx.strokeStyle = 'rgba(30, 41, 59, 0.4)';
            ctx.lineWidth = 1;

            for (let x = 0; x < GAME_WIDTH; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, GAME_HEIGHT);
                ctx.stroke();
            }
            for (let y = 0; y < GAME_HEIGHT; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(GAME_WIDTH, y);
                ctx.stroke();
            }
        }

        function drawBullets() {
            ctx.fillStyle = '#f97316';
            bullets.forEach(bullet => {
                ctx.shadowColor = '#f97316';
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.roundRect(
                    bullet.x - bullet.width / 2,
                    bullet.y - bullet.height / 2,
                    bullet.width,
                    bullet.height,
                    3
                );
                ctx.fill();
                ctx.shadowBlur = 0;
            });
        }

        function drawEnemies() {
            enemies.forEach(enemy => {
                drawEnemyDragon(enemy.x, enemy.y);
            });
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        function gameLoop(timestamp = 0) {
            if (!isGameOver) {
                updatePlayerPosition();

                if (keys.Space && timestamp - lastShootTime > SHOOT_COOLDOWN) {
                    createBullet();
                    lastShootTime = timestamp;
                }

                if (timestamp - lastEnemySpawnTime > ENEMY_SPAWN_INTERVAL) {
                    createEnemy();
                    lastEnemySpawnTime = timestamp;
                }

                updateBullets();
                updateEnemies();
                updateParticles();
                checkCollisions();
            }

            drawBackground();
            drawBullets();
            drawEnemies();
            drawParticles();
            drawPlayerSpaceship(player.x, player.y, player.width, player.height);

            requestAnimationFrame(gameLoop);
        }

        // 초기 시작
        renderHP();
        gameLoop();
    </script>
</body>
</html>
